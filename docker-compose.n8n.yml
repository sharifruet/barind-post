# Local automation stack for the news-publishing pipeline (N8N_NEWS_AUTOMATION_PLAN.md).
# Kept as a separate compose file on purpose: n8n is a personal automation tool, not
# part of this app's own deployable stack — it just needs to be able to reach it. For
# local dev/testing it joins the app stack's docker network (started by
# docker-compose.yml) so it can call the app container directly as `http://app`; the
# real deployment target is the production domain, not this network join.
#
# Usage:
#   docker compose up -d                        # app + db (docker-compose.yml) first
#   cp n8n.env.example .env.n8n                  # then fill in a real N8N_ENCRYPTION_KEY
#   docker compose -f docker-compose.n8n.yml up -d
#   open http://localhost:5678

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: barindpost_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env.n8n
    environment:
      # Where the pipelines create drafts. Every workflow builds its API URLs from this
      # one value ({{ $env.BARIND_API_BASE }}), so retargeting is this line plus a
      # `docker compose -f docker-compose.n8n.yml up -d`:
      #   https://www.barindpost.com  → the live site (needs automation.apiKey +
      #                                 automation.authorId in the production .env, and the
      #                                 n8n credential holding that same key)
      #   http://app                  → the local Docker app from docker-compose.yml
      # Override without editing this file: BARIND_API_BASE=http://app docker compose ... up -d
      BARIND_API_BASE: ${BARIND_API_BASE:-https://www.barindpost.com}
      # Recent n8n blocks $env in expressions by default, which is what the URLs above use.
      # Re-enabling it does not widen the trust boundary here: anyone who can edit a workflow
      # can already use (and therefore exfiltrate) any stored credential. Keep n8n's own login
      # as the real boundary.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # The collect pipeline holds many fetched HTML pages in memory at once;
      # the default ~2GB Node heap OOM-crashes "Extract Text + Image". The VM has ~7.7GB.
      NODE_OPTIONS: "--max-old-space-size=4096"
      # n8n 2.x runs Code nodes in a separate task-runner process with its OWN heap
      # and task timeout. The collect crashes there ("Extract Text + Image" / "Curate
      # Foreign"), so raise both. NODE_OPTIONS above only covers the main process.
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "4096"
      N8N_RUNNERS_TASK_TIMEOUT: "3600"
      # Stop hoarding execution data (the 2GB+ DB): keep only errors, and auto-prune.
      # Success runs store every fetched HTML page — huge and useless to keep.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "48"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "200"
      # Kill any single execution that runs longer than this (seconds) so a hung
      # collect run can never pile up and block the schedule. A full collect is ~15-20 min.
      EXECUTIONS_TIMEOUT: "3600"
      EXECUTIONS_TIMEOUT_MAX: "3900"
      # Facebook page publishing (n8n-workflows/facebook-pipeline.json). Put the real
      # values in .env.n8n, never here: a Facebook Page ID and a long-lived Page access
      # token with pages_manage_posts. The "Publish to Facebook" workflow reads them as
      # $env at run time. Empty by default so the pipeline simply can't post until set.
      BARIND_FB_PAGE_ID: ${BARIND_FB_PAGE_ID:-}
      BARIND_FB_PAGE_TOKEN: ${BARIND_FB_PAGE_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - barindpost

  # Renders a "text card" PNG (title + subtitle + key points) for image-less
  # news, so those articles have a picture on cards, the article page and social
  # shares. Uses @napi-rs/canvas (Skia), which shapes Bangla correctly — GD on
  # the PHP server does not. No AI: it only lays out text the pipeline already
  # produced. The workflows reach it at http://card-renderer:3000/render.
  card-renderer:
    build: ./card-renderer
    image: barindpost-card-renderer:latest
    container_name: barindpost_card_renderer
    restart: unless-stopped
    networks:
      - barindpost

volumes:
  n8n_data:

networks:
  barindpost:
    external: true
    name: barind-post_barindpost
